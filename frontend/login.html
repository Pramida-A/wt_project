<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in | ShopeQuick</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body><div id="site-header"></div><main class="wrap narrow-page"><section class="form-panel"><p class="eyebrow">WELCOME BACK</p><h1>Your basket awaits.</h1><p class="muted">Sign in with your email and confirm the demo OTP to see your saved orders.</p><form id="login-form"><label class="field"><span>Email address</span><input name="email" type="email" autocomplete="email" required placeholder="you@example.com"></label><label class="field otp-field" id="login-otp-wrap" hidden><span>Demo OTP</span><input name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="6-digit code"></label><button class="button button-primary full-button" type="submit">Continue</button><p class="form-message" id="login-message" role="status" aria-live="polite"></p></form><p class="form-foot">New to ShopeQuick? <a href="register.html">Create a profile</a></p><p class="form-foot">Store team? <a href="admin-login.html">Admin login</a></p><p class="static-note">Static demo · OTP is shown on screen. No real SMS is sent.</p></section></main><div id="site-footer"></div><script src="js/tracking.js"></script><script src="js/app.js"></script><script src="js/account.js"></script></body></html>

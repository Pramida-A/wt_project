<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Shop all | ShopeQuick</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body><div id="site-header"></div><main class="wrap page-main"><div class="page-intro"><p class="eyebrow">YOUR NEIGHBOURHOOD STORE</p><h1>All the everyday good stuff.</h1><p>Fresh produce, pantry staples, and little things that make the day easier.</p></div><div class="catalog-tools"><label class="field search-field"><span>Search products</span><input id="catalog-search" type="search" placeholder="Try mangoes, atta, or tea"></label><label class="field"><span>Category</span><select id="category-filter"><option value="all">All categories</option></select></label><label class="field"><span>Price</span><select id="price-filter"><option value="all">Any price</option><option value="0-100">Under ₹100</option><option value="100-500">₹100–₹500</option><option value="500-100000">Over ₹500</option></select></label><label class="field"><span>Sort by</span><select id="sort-products"><option value="popular">Popular nearby</option><option value="price-low">Price: low to high</option><option value="price-high">Price: high to low</option><option value="rating">Top rated</option></select></label><label class="field"><span>Availability</span><select id="availability-filter"><option value="all">All items</option><option value="available">In stock</option></select></label><label class="field"><span>Discount</span><select id="discount-filter"><option value="all">All deals</option><option value="discounted">On offer</option></select></label></div><div class="catalog-result-line"><span id="result-count"></span><button class="text-button" id="clear-filters" type="button">Clear filters</button></div><div id="catalog-products" class="product-grid"></div><p id="catalog-empty" class="empty-state" hidden>Nothing matched those filters. Try another search or category.</p></main><div id="site-footer"></div><script src="js/products.js"></script><script src="js/tracking.js"></script><script src="js/app.js"></script><script src="js/catalog.js"></script></body></html>

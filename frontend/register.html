<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account | ShopeQuick</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body><div id="site-header"></div><main class="wrap narrow-page"><section class="form-panel"><p class="eyebrow">A QUICK HELLO</p><h1>Join your neighbourhood shop.</h1><p class="muted">Create a local demo profile to save your basket and see order history.</p><form id="register-form"><label class="field"><span>Your name</span><input name="name" autocomplete="name" minlength="2" maxlength="70" required placeholder="Aarav Mehta"></label><label class="field"><span>Email address</span><input name="email" type="email" autocomplete="email" required maxlength="120" placeholder="you@example.com"></label><label class="field"><span>Mobile number</span><div class="phone-input"><span>+91</span><input name="phone" type="tel" autocomplete="tel-national" inputmode="numeric" pattern="[0-9 ]{10,12}" minlength="10" maxlength="12" required placeholder="98765 43210"></div></label><label class="field otp-field" id="register-otp-wrap" hidden><span>Demo OTP</span><input name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="6-digit code"></label><button class="button button-primary full-button" type="submit">Continue</button><p class="form-message" id="register-message" role="status" aria-live="polite"></p></form><p class="form-foot">Already have a profile? <a href="login.html">Sign in</a></p><p class="static-note">Static demo · use the OTP shown after continuing. No real SMS is sent.</p></section></main><div id="site-footer"></div><script src="js/tracking.js"></script><script src="js/app.js"></script><script src="js/account.js"></script></body></html>
